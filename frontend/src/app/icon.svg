<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <mask id="perforations">
      <rect width="32" height="32" rx="3" fill="#ffffff" />
      <!-- Top edge perforations -->
      <circle cx="6" cy="0" r="1.75" fill="#000000" />
      <circle cx="11" cy="0" r="1.75" fill="#000000" />
      <circle cx="16" cy="0" r="1.75" fill="#000000" />
      <circle cx="21" cy="0" r="1.75" fill="#000000" />
      <circle cx="26" cy="0" r="1.75" fill="#000000" />
      <!-- Bottom edge perforations -->
      <circle cx="6" cy="32" r="1.75" fill="#000000" />
      <circle cx="11" cy="32" r="1.75" fill="#000000" />
      <circle cx="16" cy="32" r="1.75" fill="#000000" />
      <circle cx="21" cy="32" r="1.75" fill="#000000" />
      <circle cx="26" cy="32" r="1.75" fill="#000000" />
      <!-- Left edge perforations -->
      <circle cx="0" cy="8" r="1.75" fill="#000000" />
      <circle cx="0" cy="16" r="1.75" fill="#000000" />
      <circle cx="0" cy="24" r="1.75" fill="#000000" />
      <!-- Right edge perforations -->
      <circle cx="32" cy="8" r="1.75" fill="#000000" />
      <circle cx="32" cy="16" r="1.75" fill="#000000" />
      <circle cx="32" cy="24" r="1.75" fill="#000000" />
    </mask>
  </defs>

  <!-- Stamp body -->
  <rect width="32" height="32" fill="#151515" mask="url(#perforations)" />

  <!-- Inner dashed border -->
  <rect x="3.5" y="3.5" width="25" height="25" rx="1.5" fill="none" stroke="#e5e5e0" stroke-width="0.8" stroke-dasharray="2 1.5" />

  <!-- Envelope Fold Motif -->
  <rect x="7" y="10" width="18" height="12" rx="1.5" fill="#242424" stroke="#e5e5e0" stroke-width="0.9" />
  <path d="M7.5 10.5 L16 16.5 L24.5 10.5" fill="none" stroke="#ff5a1f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Red Wax Seal / Stamp Mark Accent -->
  <circle cx="16" cy="16.5" r="2.2" fill="#ff5a1f" />
</svg>
